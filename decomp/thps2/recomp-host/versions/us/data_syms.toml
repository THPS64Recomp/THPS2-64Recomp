# Game data addresses and struct offsets for code class us (THPS2 USA; names: versions/host_syms.toml).
# Facts only; where each was found: the private development notes (H3 controls, H4 skip intro, H6 widescreen).
[addr]
gTextExpansionFound    = 0x8001FF7C
gTextExpansionNotFound = 0x8001FF94
gSControl              = 0x800EA8E4
gSkater                = 0x800EA4DC
gTvType                = 0x800F5864   # GameEntry's init copies osTvType here (0x800B6A4C)
gRunActive             = 0x800DBF70   # 1 while a level run is played, 0 paused / front end / screens over the level (RAM diffs; set by the pause handler at 0x8006C94C)
gFarPlane              = 0x800E4A80   # draw distance: far plane (float, fog end / 16; written by func_80023CFC); View_SetFrustum's far for the gameplay camera
gWorldFarCache         = 0x800DBD48   # func_80023800 sets the world view 0x800DB290 again only when gFarPlane != this copy
gDlBufSize             = 0x80101DF4   # 0x12000
gDlBufs                = 0x80101E10   # [2] display list buffers (OSTask data_ptr)
gDlHead                = 0x800F8D64   # the frame start (0x800B98C8) sets it to gDlBufs[gDlFrame] + 8; the frame end (0x800B9A24) checks head - buffer against gDlBufSize
gDlFrame               = 0x800F8978   # 0 or 1: the buffer the frame being built uses
gMtxPools              = 0x80101E18   # [2] matrix pools; allocator 0x800B8AD4 (count 0x80101E20, cap below, overflow counter 0x80101E28)
gMtxCap                = 0x80101E24   # 420
gVtxPools              = 0x80101E30   # [2] vertex pools (count 0x80101E38)
gVtxCap                = 0x80101E40   # 500
gWorldItems            = 0x800DD6F4   # the course item list (World_DrawItems, World_SetVisibilityInBox)
gRenderer              = 0x800FAFB8   # pointer to the renderer: World_DrawItems hands it to the mesh batcher 0x800C51FC (`lw a0` at 0x80041CD8)
gTimeScale             = 0x800E87AC   # gPhysicsFrameTime * 7680 each frame (the frame update; Slow-Nic: / 4 while the skater does a trick)
gMusNumChannels        = 0x80101FE0   # MUS library globals: channel count; MusHandleStop 0x800D3F7C / __MusIntMain 0x800D4A20 read both
gMusChannels           = 0x80101FE8   # MUS library globals: the channel records (304 bytes each)

[field]
View_Frustum      = 0x160   # l, r, b, t, near, far (floats)
Skater_ControlPtr = 0x1B04
Skater_PhysState  = 0x1960
Skater_RailBalance = 0x1D28   # rail lean; Cheat_IsOn(Perfect Balance) -> 0 in the rail physics
Intro_Timer       = 0x250   # t2_intro screen: legal-text timer (float)
Intro_State       = 0x260   # t2_intro screen: state word
