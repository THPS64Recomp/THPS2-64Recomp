# Host-forced names for code class us (THPS2 USA). Read by decomp/common/gen_host_syms.py --force; the same
# NAMES must exist in every class (versions/host_syms.toml `funcs`), at that class's own addresses.
# (Was decomp/common/host_force/thps2.toml before the multi-version tables.)

splits = [0x800B6360]   # run-time lookup miss (LOG H1): hidden start inside func_800B6308

[force]
"0x80000400" = "Boot_Entry"
"0x80000870" = "Boot_Main"
"0x80000AB4" = "Boot_PioCopy"
"0x80000B1C" = "Erz_Unpack"
"0x80000C50" = "Erz_UnpackMethod2"
"0x80001340" = "Erz_UnpackMethod1"
"0x80002F20" = "thps_osSetEventMesg"
"0x80004890" = "thps_osPiRawStartDma"
"0x80011A40" = "thps_osAiGetStatus"
"0x800075B4" = "thps_osContGetQuery"
"0x80045270" = "Cop2_GteLoad"         # 6x mtc2 + 3x mfc2 (PS1 GTE leftovers): instruction patches below
"0x800CF294" = "Pi_DmaThread"
"0x800B6AF8" = "GameEntry"
# Widescreen / skip intro / test aid (names are ours, by what the code does):
"0x800C0D3C" = "View_SetFrustum"      # glFrustum(view, l, r, b, t, n, f): l..f at view+0x160
"0x800C1838" = "View_ComputeCullPlanes"
"0x800BFFB4" = "MsgBox_SetText"       # (box, text, ...): stores a message box's text pointer
"0x800570C4" = "Level_IsSelectable"   # (level, mode): the level select's "available?" test
"0x80058010" = "Cheat_IsOn"   # (index): the cheat-on byte of cheat `index` (game state +0x15A6 + 4 * index); every cheat test of the game goes through it
"0x80041964" = "World_DrawItems"   # the world item loop: skips items whose trigger-visibility bit (1, player 2: 0x40) is set; draw distance "full" (game/draw_distance.cpp)
"0x800B3F5C" = "Mem_Alloc"   # (heap, size, align): first fit (draw distance: the matrix-pool request at start-up)
"0x80033FAC" = "World_SetVisibilityInBox"   # (min, max, ..., set mask, clear mask): the trigger scripts' zone culling; draw distance tracks which items it hid
"0x800B90BC" = "Gfx_SetupCourse"   # (): the course gfx set-up (callers 0x80037F78 .. 0x80038440): gDlBufSize = gDlUnits x 8 (0x800F8944, set to 0x2400 / 0x3000 by 0x800B8710), the two display lists (0x800B92B8), then the matrix and vertex pools; the front end has its own (0x800B9438)
"0x800C50B0" = "Mesh_PassBegin"   # (renderer): batching on (+0x2AE0 = 1); World_DrawItems' caller 0x800336E0 wraps it in a begin / end pair
"0x800C50D0" = "Mesh_PassEnd"   # (renderer): flushes the batch (0x800C5A64), Mesh_QueueEmit, then empties the lists and turns batching off
"0x800C61E0" = "Mesh_QueueEmit"   # (renderer): draws the mesh queue (512 entries, the flush 0x800C5A64 drops the rest) and the depth-sorted list (96); called from the pass end 0x800C50D0
"0x80042E74" = "World_FindItem"   # (list, name checksum) -> item: how the scripts' per-item commands (show / hide / kill by name) and the gameplay code find an item
"0x800B6818" = "Tv_IsHomeRegion"      # returns gTvType != 0 (NTSC/MPAL console): the region check of func_80037350
"0x800D1E34" = "Music_LoadSong"   # (player, song): MusHandleStop(old, 0), then the song is copied into the player's one buffer (src/music.cpp)

[overlay_force]
"t2_intro+0x114" = "Ovl_IntroUpdate"  # the intro screen's update (legal text + logos; LOG H4)

# N64Recomp config pieces (tools/gen_versions.py). The VR4300 has no COP2; these paths must be dead in practice.
[cop2]
patch = { Cop2_GteLoad = [0x800454A8, 0x800454AC, 0x800454B0, 0x800454B4, 0x800454B8, 0x800454BC, 0x800454D4, 0x800454D8, 0x800454DC] }
